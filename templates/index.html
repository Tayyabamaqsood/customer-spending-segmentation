<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Category Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#24357a; --navy2:#1a2659; --cream:#fbf6ee; --cream2:#f3eadb;
    --ink:#1d2340; --muted:#6b7090; --gold:#f5b942; --coral:#ff7a6b;
    --c0:#f5b942; --c1:#2fb67c; --c2:#ff6fa3; --c3:#3a9bdc; --c4:#8f7ae6;
    --surface:#ffffff; --field:#fbf6ee; --line:#f0e8da; --accent:#24357a;
    --bg1:#fdf9f3; --bg2:#f1e8da; --glow1:#ffe9c766; --glow2:#cfe0ff88; --shadow:#24357a2e; --blob:.5;
  }
  :root[data-theme="dark"]{
    --ink:#eef0fb; --muted:#9aa1c4;
    --surface:#1a2142; --field:#222a52; --line:#2c3566; --accent:#8fa6ff;
    --bg1:#0e1430; --bg2:#141b3d; --glow1:#3b2f6b55; --glow2:#1f4a8a55; --shadow:#00000066; --blob:.18;
  }
  body,.sheet,.board,.bubble,.status,.chip,.num,.btn.ghost,.theme{transition:background-color .4s,color .4s,border-color .4s}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Nunito",system-ui,sans-serif;color:var(--ink);overflow:hidden;
    background:
      radial-gradient(900px 500px at 15% 10%,var(--glow1),transparent 60%),
      radial-gradient(800px 500px at 90% 20%,var(--glow2),transparent 60%),
      linear-gradient(180deg,var(--bg1),var(--bg2));background-color:var(--bg1);
  }
  /* floating background blobs */
  .blob{position:fixed;border-radius:50%;filter:blur(2px);opacity:var(--blob);animation:float 9s ease-in-out infinite}
  .b1{width:120px;height:120px;background:#ffd88a;top:12%;left:6%}
  .b2{width:80px;height:80px;background:#b9cdfa;top:65%;left:12%;animation-delay:-3s}
  .b3{width:150px;height:150px;background:#ffc2b8;top:18%;right:8%;animation-delay:-5s}
  .b4{width:60px;height:60px;background:#c4ecd8;bottom:10%;right:20%;animation-delay:-2s}
  @keyframes float{50%{transform:translateY(-22px) scale(1.05)}}

  .brand{position:fixed;top:18px;left:22px;font-family:"Fredoka";font-weight:700;font-size:18px;color:var(--accent);z-index:5;display:flex;gap:8px;align-items:center}
  .brand i{width:28px;height:28px;border-radius:9px;background:var(--navy);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
  .status{position:fixed;top:20px;right:22px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);padding:6px 12px;border-radius:99px;box-shadow:0 4px 14px #24357a14;z-index:5;display:flex;gap:6px;align-items:center}
  .status b{width:8px;height:8px;border-radius:50%;background:#bbb}
  .status.on b{background:#2fb67c;box-shadow:0 0 8px #2fb67c}
  .status.off b{background:var(--coral)}

  /* ---------- stage ---------- */
  .stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center}
  .char-wrap{
    position:absolute;bottom:0;left:50%;width:min(360px,70vw);
    transform:translateX(-50%);transition:left .9s cubic-bezier(.6,.05,.25,1),width .9s,bottom .9s;
    z-index:3;
  }
  .char{width:100%;display:block;transform-origin:50% 100%;animation:enter 1s cubic-bezier(.2,1.4,.4,1) both, idle 4s ease-in-out 1s infinite;filter:drop-shadow(0 18px 30px #24357a33)}
  @keyframes enter{from{transform:translateY(110%) rotate(-6deg)}to{transform:none}}
  @keyframes idle{50%{transform:translateY(-6px) rotate(-1deg)}}
  .char.bend{animation:bend .8s cubic-bezier(.45,0,.25,1) both}
  @keyframes bend{0%{transform:none}45%{transform:translateY(34px) rotate(8deg) scaleY(.95)}100%{transform:none}}
  .char.pop{animation:pop .8s cubic-bezier(.2,1.6,.4,1) both, idle 4s ease-in-out .8s infinite}
  @keyframes pop{0%{transform:translateY(100%) scale(.8)}100%{transform:none}}
  .char-fallback{display:none;width:100%;aspect-ratio:.8;border-radius:40% 40% 0 0;background:linear-gradient(var(--navy),var(--navy2));align-items:center;justify-content:center;font-size:90px}

  /* speech bubble */
  .bubble{
    position:absolute;bottom:calc(100% - 40px);left:58%;min-width:230px;max-width:280px;
    background:var(--surface);border-radius:22px;padding:16px 18px;box-shadow:0 14px 40px #24357a26;
    font-family:"Fredoka";font-weight:600;font-size:19px;line-height:1.3;color:var(--accent);
    transform-origin:0 100%;animation:bubble .6s cubic-bezier(.2,1.6,.4,1) .9s both;
  }
  .bubble:after{content:"";position:absolute;left:18px;bottom:-12px;border:12px solid transparent;border-top-color:var(--surface);border-bottom:0}
  .bubble small{display:block;font-family:"Nunito";font-weight:600;font-size:13px;color:var(--muted);margin-top:6px}
  .bubble.hide{animation:bubbleOut .3s ease both}
  @keyframes bubble{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
  @keyframes bubbleOut{to{opacity:0;transform:scale(.4)}}

  /* sits right at her fingertip */
  .start{
    position:absolute;bottom:51%;left:calc(100% + 6px);white-space:nowrap;
    transform-origin:0 50%;animation:bubble .6s cubic-bezier(.2,1.6,.4,1) 1.3s both;
  }
  .start .btn{animation:nudge 1.4s ease-in-out 2s infinite}
  @keyframes nudge{50%{transform:translateX(8px)}}
  .btn{border:0;cursor:pointer;font-family:"Fredoka";font-weight:600;font-size:17px;color:#fff;background:var(--navy);
    padding:14px 26px;border-radius:16px;box-shadow:0 6px 0 var(--navy2),0 14px 30px #24357a40;transition:.15s;display:inline-flex;gap:10px;align-items:center}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy2)}
  .btn:disabled{opacity:.7;cursor:wait}
  .btn.ghost{background:var(--surface);color:var(--accent);box-shadow:0 6px 0 var(--line),0 14px 30px var(--shadow)}

  /* ---------- form card ---------- */
  /* Motion best practices: transform + opacity only, ease-out on enter,
     ease-in on exit, short durations, subtle stagger, reduced-motion aware. */
  .sheet{
    position:absolute;top:50%;right:7vw;width:min(440px,92vw);
    background:var(--surface);border-radius:28px;padding:28px 26px 26px;z-index:4;
    box-shadow:0 30px 70px var(--shadow),0 8px 20px #24357a14;
    opacity:0;visibility:hidden;pointer-events:none;
    transform:translateY(calc(-50% + 40px)) scale(.97);
    transition:opacity .35s ease-in,transform .35s ease-in,visibility 0s linear .35s;
  }
  .sheet.up{
    opacity:1;visibility:visible;pointer-events:auto;transform:translateY(-50%);
    transition:opacity .45s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1),visibility 0s;
  }
  .sheet.down{opacity:0;transform:translateY(calc(-50% + 40px)) scale(.97)}
  .sheet > *{opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
  .sheet.up > *{opacity:1;transform:none;transition:opacity .4s cubic-bezier(.22,1,.36,1),transform .4s cubic-bezier(.22,1,.36,1)}
  .sheet.up > :nth-child(2){transition-delay:.12s}
  .sheet.up > :nth-child(3){transition-delay:.16s}
  .sheet.up > :nth-child(4){transition-delay:.20s}
  .sheet.up > :nth-child(5){transition-delay:.24s}
  .sheet.up > :nth-child(6){transition-delay:.28s}
  .sheet.up > :nth-child(7){transition-delay:.32s}
  .handle{width:44px;height:5px;border-radius:9px;background:var(--gold);margin:0 0 16px}
  .sheet h2{font-family:"Fredoka";font-size:24px;color:var(--accent)}
  .sheet p.sub{color:var(--muted);font-size:14px;margin:4px 0 20px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .chip{border:2px solid var(--line);background:var(--field);font:700 12px "Nunito";color:var(--ink);padding:7px 12px;border-radius:99px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--gold);transform:translateY(-1px)}
  .field{margin-bottom:22px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  label{font-weight:800;font-size:14px}
  label span{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
  .num{width:84px;border:2px solid var(--line);background:var(--field);border-radius:12px;padding:8px 10px;font:800 16px "Nunito";color:var(--accent);text-align:right}
  .num:focus{outline:none;border-color:var(--accent)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;outline:none;
    background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--accent);cursor:pointer;box-shadow:0 3px 10px #0003}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid var(--accent);cursor:pointer}
  .hint{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;font-weight:700}
  .sheet .btn{width:100%;justify-content:center;font-size:18px}
  .spin{width:18px;height:18px;border:3px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;display:none}
  .loading .spin{display:block}
  @keyframes s{to{transform:rotate(360deg)}}

  /* ---------- result board ---------- */
  /* result card beside her, where her finger points */
  .board{
    position:absolute;left:60%;top:56%;width:min(380px,90vw);transform:translate(-50%,-50%);
    background:var(--surface);border-radius:26px;overflow:hidden;z-index:4;display:none;
    box-shadow:0 30px 70px var(--shadow),0 8px 20px #24357a14;
  }
  .board.show{display:block;animation:boardIn .7s cubic-bezier(.22,1,.36,1) .3s both}
  @keyframes boardIn{0%{opacity:0;transform:translate(-50%,-50%) translateX(-50px) scale(.9)}100%{opacity:1;transform:translate(-50%,-50%)}}
  .scene{position:relative;height:150px;background:var(--bg);overflow:hidden}
  .scene svg{position:absolute;inset:0;width:100%;height:100%}
  .scene .tag{position:absolute;top:12px;left:14px;background:#ffffffd9;color:var(--ink)}
  .card-body{padding:16px 20px 18px}
  .tag{display:inline-block;font:800 10.5px "Nunito";letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
  .board h3{font-family:"Fredoka";font-size:25px;line-height:1.15;color:var(--ink);display:flex;gap:8px;align-items:center}
  .board p{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:4px}
  .meters{display:grid;gap:9px;margin:14px 0 12px}
  .meter{font-size:11.5px;font-weight:800;color:var(--muted)}
  .meter .top{display:flex;justify-content:space-between;margin-bottom:4px}
  .meter .top b{color:var(--ink)}
  .bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--col);transition:width 1.1s cubic-bezier(.22,1,.36,1)}
  .tips-h{font:800 12px "Nunito";color:var(--ink);margin:0 0 7px}
  .board ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
  .board li{font-size:12px;font-weight:700;background:var(--soft);color:var(--ink);border-radius:99px;padding:6px 11px}

  /* segment map: the customer plotted among all 5 groups */
  .scene{height:170px;background:var(--field);border-bottom:1px solid var(--line)}
  .scene .tag{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px var(--shadow);z-index:2}
  .axis-l.cap{top:14px;right:12px;text-transform:none;letter-spacing:0;font-size:11px}
  .axis-l{position:absolute;font:800 9.5px "Nunito";letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .pt{opacity:0;transition:opacity .5s ease,r .5s ease}
  .scene.on .pt{opacity:.28}
  .scene.on .pt.hit{opacity:.95}
  .pin{opacity:0;transform:translateY(-30px);transition:transform .6s cubic-bezier(.34,1.56,.64,1) .9s,opacity .3s .9s}
  .scene.on .pin{opacity:1;transform:none}
  .ring{fill:none;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
  .scene.on .ring{animation:ripple 2s ease-out 1.5s infinite}
  @keyframes ripple{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}

  /* theme toggle + history */
  .theme{position:fixed;top:14px;right:22px;z-index:6;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
    background:var(--surface);color:var(--ink);font-size:18px;box-shadow:0 4px 14px var(--shadow);display:grid;place-items:center}
  .theme:hover{transform:rotate(-15deg)}
  .theme:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  /* confidence ring */
  .sure{display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .sure svg{width:44px;height:44px;flex-shrink:0;transform:rotate(-90deg)}
  .sure .trk{fill:none;stroke:var(--line);stroke-width:5}
  .sure .val{fill:none;stroke:var(--col);stroke-width:5;stroke-linecap:round;stroke-dasharray:113;stroke-dashoffset:113;transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)}
  .sure b{display:block;font:700 18px "Fredoka";color:var(--ink)}
  /* live preview under the sliders */
  .preview{display:flex;align-items:center;gap:8px;margin:-6px 0 16px;padding:10px 12px;border-radius:14px;background:var(--field);
    font-size:13px;font-weight:700;color:var(--muted);transition:background .3s}
  .preview i{width:10px;height:10px;border-radius:50%;background:var(--muted);transition:background .3s;flex-shrink:0}
  .preview b{color:var(--ink)}
  .preview.flash{animation:flash .35s ease}
  @keyframes flash{50%{transform:scale(1.02)}}
  /* her reaction bubble on the result screen */
  .say{position:absolute;bottom:calc(100% - 30px);left:40%;max-width:250px;background:var(--surface);color:var(--accent);
    border-radius:20px;padding:12px 16px;font:600 16px/1.3 "Fredoka";box-shadow:0 14px 40px var(--shadow);opacity:0;transform:scale(.4);
    transform-origin:20px 100%;pointer-events:none;z-index:5}
  .say:after{content:"";position:absolute;left:22px;bottom:-11px;border:11px solid transparent;border-top-color:var(--surface);border-bottom:0}
  .say.show{animation:bubble .55s cubic-bezier(.2,1.6,.4,1) .5s both}
  .sound{position:fixed;top:14px;right:72px;z-index:6;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
    background:var(--surface);color:var(--ink);font-size:17px;box-shadow:0 4px 14px var(--shadow);display:grid;place-items:center}
  .history{position:fixed;left:22px;bottom:20px;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:44vw}
  .history:empty{display:none}
  .history small{font:800 10.5px "Nunito";letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .hchip{border:0;cursor:pointer;font:700 12px "Nunito";color:var(--ink);background:var(--surface);padding:6px 10px;border-radius:99px;
    box-shadow:0 3px 10px var(--shadow);display:flex;gap:6px;align-items:center;animation:bubble .4s cubic-bezier(.22,1,.36,1) both}
  .hchip i{width:8px;height:8px;border-radius:50%}
  .kbd{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--muted);font-weight:700;z-index:2}
  .kbd b{background:var(--surface);padding:2px 7px;border-radius:6px;box-shadow:0 2px 0 var(--line);color:var(--ink)}
  body.result .kbd,body.intro .kbd{display:none}
  .again{position:absolute;bottom:22px;right:22px;z-index:6;display:none}
  .again.show{display:block;animation:bubble .5s cubic-bezier(.2,1.6,.4,1) 1s both}

  /* confetti */
  .confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:7;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  /* ---------- layout states ---------- */
  body.form .char-wrap{left:28%;width:min(330px,40vw)}
  body.result .char-wrap{left:30%;width:min(380px,40vw);bottom:0}

  @media (max-width:820px){
    .sheet{top:auto;bottom:16px;right:50%;transform:translate(50%,40px) scale(.97)}
    .sheet.up{transform:translate(50%,0)}
    .sheet.down{transform:translate(50%,40px) scale(.97)}
    body.form .char-wrap{left:50%;width:150px;bottom:calc(100% - 210px)}
    .bubble{left:auto;right:4%;bottom:auto;top:-130px;min-width:0;max-width:240px;font-size:17px}
    .bubble:after{left:auto;right:30px}
    .start{left:auto;right:-2%;bottom:58%;transform-origin:100% 100%}
    .brand{font-size:15px}
    body.result .char-wrap{left:50%;width:min(230px,58vw)}
    .board{left:50%;top:auto;bottom:calc(min(230px,58vw)*1.1 + 10px);transform:translateX(-50%)}
    .scene{height:130px}
    .theme{top:62px;right:auto;left:16px;width:36px;height:36px}
    .history,.kbd{display:none}
    .sound{top:62px;right:auto;left:60px;width:36px;height:36px}
    .say{display:none}
    @keyframes boardIn{0%{opacity:0;transform:translateX(-50%) translateY(30px) scale(.9)}100%{opacity:1;transform:translateX(-50%)}}
    .again{right:16px;bottom:auto;top:62px;font-size:14px;padding:10px 16px;white-space:nowrap}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body class="intro">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="brand"><i>◎</i> Customer Category Finder</div>
  <button class="sound" id="sound" aria-label="Sound on or off" title="Sound on / off">🔊</button>
  <button class="theme" id="theme" aria-label="Toggle dark mode" title="Toggle dark / light">🌙</button>
  <div class="history" id="history"></div>

      <div class="char char-fallback" id="fallback">🧕</div>

    <!-- form pulled from the bottom -->
    <form class="sheet" id="sheet" autocomplete="off">
      <div class="handle"></div>
      <h2>Tell me about your customer</h2>
      <p class="sub">Just two quick questions. Drag the sliders or tap an example.</p>

      <div class="chips">
        <button type="button" class="chip" data-i="20" data-s="80">🛍️ Young shopper</button>

        <button type="button" class="chip" data-i="90" data-s="15">🏦 Saver</button>

      </div>

      <div class="field">
        <div class="row"><label for="income">How much do they earn a year? <span>(in $ thousands)</span></label>
          <input class="num" id="incomeN" type="number" min="0" max="150" value="60" inputmode="numeric"></div>
        <input type="range" id="income" min="0" max="150" value="60">
        <div class="hint"><span>$0</span><span>$75k</span><span>$150k</span></div>
      </div>

      <div class="field">
        <div class="row"><label for="score">How much do they shop? <span>(1 = rarely, 100 = a lot)</span></label>
          <input class="num" id="scoreN" type="number" min="1" max="100" value="50" inputmode="numeric"></div>
        <input type="range" id="score" min="1" max="100" value="50">
        <div class="hint"><span>Rarely spends</span><span>Loves shopping</span></div>
      </div>

      <div class="preview" id="preview" aria-live="polite"><i></i><span>Move a slider to see a live guess</span></div>

    </form>

    <!-- result board -->
    <div class="board" id="board"></div>
  </div>

  <button class="btn ghost again" id="again">↺ Try another customer</button>

<script>
const SEG={
  0:{emoji:"🙂",color:"var(--c0)",tag:"Steady Regulars",
     desc:"Moderate income, moderate spending — the steady heart of the business.",
     tips:["Loyalty points for repeat visits","Bundles & seasonal offers"]},
  1:{emoji:"💎",color:"var(--c1)",tag:"VIP Shoppers",
     desc:"High income and loves to spend — the most valuable segment.",
     tips:["VIP perks & early access","Premium products and service"]},
  2:{emoji:"🛍️",color:"var(--c2)",tag:"Trend Chasers",
     desc:"Modest income but loves to shop — quick to jump on trends and deals.",
     tips:["Flash sales & discount codes","Affordable, trendy picks"]},
  3:{emoji:"🏦",color:"var(--c3)",tag:"Cautious Wealthy",
     desc:"Earns a lot but spends little — big untapped potential.",
     tips:["Highlight quality & value","Exclusive personalised offers"]},
  4:{emoji:"🪙",color:"var(--c4)",tag:"Thrifty Savers",
     desc:"Low income, low spending — price-sensitive and less engaged.",
     tips:["Essentials-focused products","Low-cost re-engagement"]}
};

// segment map: sample points around each cluster's real centre (from the notebook)
const CENTERS={0:[55.3,49.5],1:[86.5,82.1],2:[25.7,79.4],3:[88.2,17.1],4:[26.3,20.9]};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647-.5};
const SAMPLES=[];for(const k in CENTERS)for(let i=0;i<22;i++)
  SAMPLES.push([+k,CENTERS[k][0]+rnd()*30,CENTERS[k][1]+rnd()*30]);
const X=v=>30+Math.max(0,Math.min(150,v))/150*330, Y=v=>150-Math.max(0,Math.min(100,v))/100*125;
function mapSVG(cid,inc,sc){
  const pts=SAMPLES.map(([k,x,y])=>`<circle class="pt ${k==cid?"hit":""}" cx="${X(x)}" cy="${Y(y)}" r="${k==cid?4:3}" fill="${SEG[k].color}"/>`).join("");
  return `<svg viewBox="0 0 380 170" aria-label="Customer plotted among the five segments">
    <line x1="30" y1="150" x2="365" y2="150" stroke="var(--line)" stroke-width="2"/><line x1="30" y1="20" x2="30" y2="150" stroke="var(--line)" stroke-width="2"/>
    ${pts}
    <circle class="ring" cx="${X(inc)}" cy="${Y(sc)}" r="10" stroke="${SEG[cid]?.color||"#999"}"/>
    <g class="pin"><circle cx="${X(inc)}" cy="${Y(sc)}" r="8" fill="var(--surface)" stroke="${SEG[cid]?.color||"#999"}" stroke-width="4"/></g>
  </svg><span class="axis-l" style="right:12px;bottom:4px">Earns more →</span><span class="axis-l" style="left:-10px;top:40%;transform:rotate(-90deg)">Shops more →</span><span class="axis-l cap">● = shoppers like them</span>`;
}
const SAY={
  0:["A steady regular! 🙂 They keep coming back.","Solid and reliable. Every shop needs these!"],
  1:["Ooh, a big spender! 💎 Treat them like royalty.","A VIP! Roll out the red carpet ✨"],
  2:["A trend chaser! 🛍️ They can't resist a good deal.","They love shopping. Show them what's new!"],
  3:["Wealthy but careful 🏦 Let's earn their trust.","They can spend, they just need a reason!"],
  4:["A thrifty saver 🪙 Every penny counts for them.","Budget-minded. Keep it simple and affordable."]
};
const $=id=>document.getElementById(id);
const body=document.body, ch=$("char"), sheet=$("sheet"), board=$("board");
let busy=false;

// replay a CSS animation class
function play(el,cls){el.classList.remove("bend","pop");void el.offsetWidth;el.classList.add(cls);}
const charEl=()=>ch.style.display==="none"?$("fallback"):ch;

// ---- intro -> form ----
$("start").onclick=()=>{
  if(busy)return;busy=true;
  $("bubble").classList.add("hide");$("startWrap").style.display="none";
  play(charEl(),"bend");SFX.whoosh();               // she bends down...
  setTimeout(()=>{sheet.classList.remove("down");sheet.classList.add("up");livePreview();},380); // ...and brings the form up
  body.className="form";
  setTimeout(()=>{busy=false;},900);
};

// ---- sliders ----
function link(r,n,min,max){
  const paint=()=>r.style.setProperty("--p",(r.value-min)/(max-min)*100+"%");
  r.oninput=()=>{n.value=r.value;paint();};
  n.oninput=()=>{const v=Math.max(min,Math.min(max,+n.value||min));r.value=v;paint();};
  n.onblur=()=>{n.value=r.value;};
  paint();
}
link($("income"),$("incomeN"),0,150);
link($("score"),$("scoreN"),1,100);
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  $("income").value=c.dataset.i;$("income").oninput();
  $("score").value=c.dataset.s;$("score").oninput();
});

// ---- predict ----
sheet.onsubmit=async e=>{
  e.preventDefault();if(busy)return;busy=true;
  const go=$("go");go.disabled=true;go.classList.add("loading");$("goTxt").textContent="Looking closely…";
  const income=+$("incomeN").value, score=+$("scoreN").value;
  let html;
  try{
    const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({annual_income:income,spending_score:score})});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||"Server error");
    setStatus(true);
    const s=SEG[d.predicted_cluster_id]||{emoji:"❔",color:"var(--muted)",tag:"Customer",desc:"",tips:[]};
    const pct=(v,m)=>Math.max(4,Math.min(100,v/m*100));
    html=`<div class="scene">${mapSVG(d.predicted_cluster_id,income,score)}
        <span class="tag">This customer is a…</span></div>
      <div class="card-body" style="--col:${s.color};--soft:color-mix(in srgb, ${s.color} 22%, var(--surface))">
        <h3>${s.emoji} ${s.tag}</h3><p>${s.desc}</p>
        ${d.confidence!=null?`<div class="sure"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="18"/><circle class="val" cx="22" cy="22" r="18" data-off="${113-113*d.confidence}"/></svg>
          <div><b>${Math.round(d.confidence*100)}% sure</b>${d.confidence>=.8?"I'm very confident about this one.":d.confidence>=.6?"Fairly confident, they're close to another type.":"A close call, they sit between two types."}</div></div>`:""}
        <div class="meters">
          <div class="meter"><div class="top"><span>Yearly income</span><b>$${income}k</b></div><div class="bar"><i data-w="${pct(income,150)}"></i></div></div>
          <div class="meter"><div class="top"><span>Shopping level</span><b>${score} out of 100</b></div><div class="bar"><i data-w="${pct(score,100)}"></i></div></div>
        </div>
        <div class="tips-h">💡 How to win them over</div>
        <ul>${s.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
      </div>`;
    setTimeout(()=>confetti(s.color),1100);
    const lines=SAY[d.predicted_cluster_id]||["Here's what I found!"];
    $("say").textContent=lines[Math.floor(Math.random()*lines.length)];
    setTimeout(SFX.ding,900);
    addHistory(d.predicted_cluster_id,income,score);
  }catch(err){
    setStatus(false);
    html=`<div class="card-body"><h3>😅 Hmm, something went wrong</h3>`;$("say").textContent="Oops! Let's try that again.";setTimeout(SFX.oops,700);html+=`<p>I couldn't work out this customer's type right now. Please try again in a moment.</p></div>`;
  }
  board.innerHTML=html;
  sheet.classList.remove("up");sheet.classList.add("down");          // form drops away
  setTimeout(()=>{
    body.className="result";
    play(charEl(),"pop");                                            // she pops up...
    board.classList.add("show");SFX.pop();                           // ...presenting the card
    $("say").classList.remove("show");void $("say").offsetWidth;$("say").classList.add("show");
    setTimeout(()=>{board.querySelectorAll(".bar i").forEach(b=>b.style.width=b.dataset.w+"%");board.querySelector(".scene")?.classList.add("on");
      board.querySelectorAll(".sure .val").forEach(c=>c.style.strokeDashoffset=c.dataset.off);},700);
    $("again").classList.add("show");
    go.disabled=false;go.classList.remove("loading");$("goTxt").textContent="Find their type 🔮";busy=false;
  },380);
};

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&body.className==="result")$("again").click();});
// ---- try again ----
$("again").onclick=()=>{
  if(busy)return;busy=true;$("say").classList.remove("show");SFX.whoosh();
  board.classList.remove("show");$("again").classList.remove("show");
  body.className="form";
  play(charEl(),"bend");
  setTimeout(()=>{sheet.classList.remove("down");sheet.classList.add("up");},380);
  setTimeout(()=>busy=false,900);
};

// ---- dark / light ----
const root=document.documentElement;
function setTheme(t){root.dataset.theme=t;$("theme").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("theme",t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
setTheme(saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("theme").onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark");

// ---- recent predictions (click to replay) ----
const hist=[];
function addHistory(cid,inc,sc){
  hist.unshift({cid,inc,sc});hist.splice(4);
  $("history").innerHTML="<small>Recent customers</small>"+hist.map((h,i)=>
    `<button class="hchip" data-i="${i}" title="Load these values"><i style="background:${SEG[h.cid]?.color}"></i>${SEG[h.cid]?.tag||"Customer"} · $${h.inc}k</button>`).join("");
  $("history").querySelectorAll(".hchip").forEach(b=>b.onclick=()=>{
    const h=hist[b.dataset.i];
    const load=()=>{$("income").value=h.inc;$("income").oninput();$("score").value=h.sc;$("score").oninput();};
    if(body.className==="result"){$("again").click();setTimeout(load,450);}else load();
  });
}

// ---- sound effects (generated in the browser, no files needed) ----
let muted=false,actx=null;
try{muted=localStorage.getItem("muted")==="1"}catch(e){}
function tone(freq,dur=.12,type="sine",vol=.15,delay=0){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
const SFX={
  pop:()=>{tone(520,.09,"sine",.12);tone(780,.1,"sine",.1,.06)},
  tick:()=>tone(900,.04,"triangle",.05),
  whoosh:()=>{tone(300,.18,"sine",.06);tone(450,.18,"sine",.05,.05)},
  ding:()=>{tone(880,.35,"sine",.14);tone(1320,.45,"sine",.1,.12);tone(1760,.5,"sine",.06,.24)},
  oops:()=>{tone(330,.2,"triangle",.1);tone(247,.3,"triangle",.1,.15)}
};
function setMute(m){muted=m;$("sound").textContent=m?"🔇":"🔊";try{localStorage.setItem("muted",m?"1":"0")}catch(e){}}
setMute(muted);
$("sound").onclick=()=>{setMute(!muted);if(!muted)SFX.pop();};
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",SFX.tick));

// ---- live guess while sliding (asks the real model, debounced) ----
let pvTimer=null,pvReq=0;
async function livePreview(){
  const id=++pvReq;
  try{
    const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({annual_income:+$("incomeN").value,spending_score:+$("scoreN").value})});
    const d=await r.json();if(id!==pvReq||!r.ok||d.error)return;
    const g=SEG[d.predicted_cluster_id];if(!g)return;
    const pv=$("preview"),txt=`Looks like a <b>${g.emoji} ${g.tag.replace(/s$/,"")}</b>`;
    if(pv.dataset.c!==String(d.predicted_cluster_id)){pv.classList.remove("flash");void pv.offsetWidth;pv.classList.add("flash");SFX.tick();}
    pv.dataset.c=d.predicted_cluster_id;
    pv.querySelector("i").style.background=g.color;pv.querySelector("span").innerHTML=txt;
  }catch(e){}
}
["income","incomeN","score","scoreN"].forEach(id=>$(id).addEventListener("input",()=>{clearTimeout(pvTimer);pvTimer=setTimeout(livePreview,180);}));
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{clearTimeout(pvTimer);pvTimer=setTimeout(livePreview,50);}));
function confetti(main){
  const cols=[main,"#f5b942","#24357a","#ff7a6b","#2fb67c"];
  for(let i=0;i<70;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";c.style.background=cols[i%cols.length];
    c.style.animationDuration=1.8+Math.random()*1.6+"s";c.style.animationDelay=Math.random()*.4+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),4000);
  }
}
